name: Deploy to Cloudways

# Auto-deploys the site to Cloudways on every push to main.
# Requires two GitHub repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDWAYS_EMAIL    – your Cloudways account email
#   CLOUDWAYS_API_KEY  – API key from Cloudways → Account → API Keys
# Server/app IDs are not secret and are set below.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CW_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
      CW_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
      CW_SERVER_ID: "1638726"
      CW_APP_ID: "6685750"
      CW_BRANCH: "main"
    steps:
      - name: Resolve Cloudways bearer token
        id: token
        run: |
          set -e
          if [ -z "$CW_EMAIL" ] || [ -z "$CW_API_KEY" ]; then
            echo "::error::CLOUDWAYS_EMAIL and CLOUDWAYS_API_KEY secrets are not set."
            exit 1
          fi
          # Cloudways renamed API Keys to Access Tokens. Handle both auth models:
          # 1) legacy: exchange email + key for a short-lived access_token
          # 2) new: the token is already a usable bearer token
          BEARER=$(curl -s -X POST https://api.cloudways.com/api/v1/oauth/access_token \
            -d "email=${CW_EMAIL}" -d "api_key=${CW_API_KEY}" \
            | python3 -c "import sys,json;
try: print(json.load(sys.stdin).get('access_token',''))
except Exception: print('')" 2>/dev/null || true)
          if [ -z "$BEARER" ]; then
            echo "OAuth exchange returned no token; using the secret directly as a bearer token."
            BEARER="$CW_API_KEY"
          fi
          echo "::add-mask::$BEARER"
          echo "token=$BEARER" >> "$GITHUB_OUTPUT"

      - name: Trigger Git pull (deploy) on Cloudways
        run: |
          set -e
          RESP=$(curl -sf -X POST https://api.cloudways.com/api/v1/git/pull \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -d "server_id=${CW_SERVER_ID}" \
            -d "app_id=${CW_APP_ID}" \
            -d "branch_name=${CW_BRANCH}")
          echo "Git pull response: $RESP"

      - name: Purge application cache (Varnish)
        continue-on-error: true
        run: |
          RESP=$(curl -s -X POST https://api.cloudways.com/api/v1/app/manage/varnish \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -d "server_id=${CW_SERVER_ID}" \
            -d "app_id=${CW_APP_ID}" \
            -d "action=purge")
          echo "Varnish purge response: $RESP"
